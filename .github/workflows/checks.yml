name: Checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests/test_app.py -q
      - run: python -m pytest tests -q
        working-directory: scraper
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:sites
