services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jobscout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U scout -d jobscout']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://scout:${POSTGRES_PASSWORD}@db:5432/jobscout
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    command: [python, -m, backend.worker]
    environment:
      DATABASE_URL: postgresql+psycopg://scout:${POSTGRES_PASSWORD}@db:5432/jobscout
      SCRAPE_WORKERS: '4'
    volumes:
      - ./scraper/config:/app/scraper/config:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
